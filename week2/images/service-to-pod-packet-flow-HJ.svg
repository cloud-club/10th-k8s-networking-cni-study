<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <rect width="960" height="435" fill="#f8fafc" rx="12"/>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Service to Pod Packet Flow</text>

  <!-- Node 1 -->
  <rect x="58" y="56" width="880" height="130" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="7,4" filter="url(#s)"/>
  <text x="76" y="78" font-size="12" font-weight="700" fill="#27ae60">Node 1</text>

  <rect x="76" y="88" width="108" height="78" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="1.8" filter="url(#s)"/>
  <text x="130" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Pod A</text>
  <text x="130" y="132" text-anchor="middle" font-size="10" fill="#64748b">10.42.0.11</text>
  <text x="130" y="152" text-anchor="middle" font-size="9.5" fill="#2980b9">dst 10.96.0.10:80</text>
  <line x1="186" y1="127" x2="204" y2="127" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="206" y="88" width="72" height="78" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="242" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">cni0</text>
  <text x="242" y="140" text-anchor="middle" font-size="9.5" fill="#64748b">default route</text>
  <line x1="280" y1="127" x2="296" y2="127" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="300" y="88" width="208" height="78" rx="8" fill="#f3ecf8" stroke="#8e44ad" stroke-width="2" filter="url(#s)"/>
  <text x="404" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">nat PREROUTING</text>
  <text x="404" y="130" text-anchor="middle" font-size="9.5" fill="#8e44ad">KUBE-SERVICES → SVC → SEP</text>
  <text x="404" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">DNAT &#160;10.96.0.10 → 10.42.1.7</text>
  <line x1="510" y1="127" x2="526" y2="127" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="530" y="88" width="156" height="78" rx="8" fill="#e8f4f8" stroke="#2980b9" stroke-width="2" filter="url(#s)"/>
  <text x="608" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">라우팅 재평가</text>
  <text x="608" y="142" text-anchor="middle" font-size="10" fill="#2980b9">10.42.1.0/24 via node-2</text>
  <line x1="688" y1="127" x2="704" y2="127" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="708" y="88" width="94" height="78" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="1.8" filter="url(#s)"/>
  <text x="755" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">FORWARD</text>
  <text x="755" y="134" text-anchor="middle" font-size="9.5" fill="#64748b">POSTROUTING</text>
  <text x="755" y="152" text-anchor="middle" font-size="9.5" fill="#c0392b">SNAT 없음</text>
  <line x1="804" y1="127" x2="820" y2="127" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="824" y="88" width="62" height="78" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="855" y="122" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">eth0</text>
  <text x="855" y="140" text-anchor="middle" font-size="9" fill="#64748b">노드 NIC</text>

  <!-- inter-node link -->
  <line x1="855" y1="166" x2="855" y2="258" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>
  <text x="838" y="216" text-anchor="end" font-size="10.5" fill="#64748b">물리 네트워크 / 오버레이 터널</text>

  <!-- Node 2 -->
  <rect x="58" y="236" width="880" height="130" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="7,4" filter="url(#s)"/>
  <text x="76" y="258" font-size="12" font-weight="700" fill="#27ae60">Node 2</text>

  <rect x="824" y="268" width="62" height="78" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="855" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">eth0</text>
  <text x="855" y="320" text-anchor="middle" font-size="9" fill="#64748b">노드 NIC</text>
  <line x1="820" y1="307" x2="802" y2="307" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="596" y="268" width="200" height="78" rx="8" fill="#e8f4f8" stroke="#2980b9" stroke-width="2" filter="url(#s)"/>
  <text x="696" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">라우팅 + FORWARD</text>
  <text x="696" y="322" text-anchor="middle" font-size="10" fill="#2980b9">10.42.1.7 dev cni0</text>
  <line x1="592" y1="307" x2="574" y2="307" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="496" y="268" width="72" height="78" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="532" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">cni0</text>
  <text x="532" y="320" text-anchor="middle" font-size="9.5" fill="#64748b">L2 전달</text>
  <line x1="492" y1="307" x2="474" y2="307" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="350" y="268" width="120" height="78" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="1.8" filter="url(#s)"/>
  <text x="410" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Pod B</text>
  <text x="410" y="322" text-anchor="middle" font-size="10" fill="#64748b">10.42.1.7:8080</text>

  <!-- return path -->
  <path d="M 410 346 L 410 400 L 40 400 L 40 127 L 68 127" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <rect x="146" y="386" width="220" height="24" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1"/>
  <text x="256" y="403" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">응답 · conntrack 역변환</text>
</svg>
