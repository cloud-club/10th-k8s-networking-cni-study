<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
  </defs>

  <rect width="820" height="390" fill="#f8fafc" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">kube-proxy (iptables mode) — Chain Traversal</text>

  <!-- PREROUTING -->
  <rect x="300" y="58" width="220" height="38" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="1.8" filter="url(#s)"/>
  <text x="410" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">nat PREROUTING / OUTPUT</text>
  <line x1="410" y1="96" x2="410" y2="120" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <!-- KUBE-SERVICES -->
  <rect x="300" y="126" width="220" height="38" rx="8" fill="#e8f4f8" stroke="#2980b9" stroke-width="2" filter="url(#s)"/>
  <text x="410" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">KUBE-SERVICES</text>
  <text x="536" y="139" font-size="10.5" fill="#64748b" font-family="monospace">-d 10.96.0.10/32</text>
  <text x="536" y="155" font-size="10.5" fill="#64748b" font-family="monospace">-p tcp --dport 80</text>
  <line x1="410" y1="164" x2="410" y2="188" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <!-- KUBE-SVC -->
  <rect x="300" y="194" width="220" height="38" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="2" filter="url(#s)"/>
  <text x="410" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">KUBE-SVC-XXXX</text>
  <text x="536" y="218" font-size="10.5" fill="#64748b">엔드포인트 3개</text>

  <!-- branches -->
  <path d="M 380 232 L 380 274 L 150 274 L 150 292" fill="none" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 410 232 L 410 292" fill="none" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 440 232 L 440 274 L 670 274 L 670 292" fill="none" stroke="#2980b9" stroke-width="2" marker-end="url(#a)"/>

  <rect x="106" y="242" width="88" height="20" rx="10" fill="#fdf3e3" stroke="#f39c12" stroke-width="1"/>
  <text x="150" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#f39c12">probability 0.33</text>
  <rect x="460" y="242" width="86" height="20" rx="10" fill="#fdf3e3" stroke="#f39c12" stroke-width="1"/>
  <text x="503" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#f39c12">probability 0.5</text>
  <rect x="626" y="242" width="88" height="20" rx="10" fill="#fdf3e3" stroke="#f39c12" stroke-width="1"/>
  <text x="670" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#f39c12">나머지 전부</text>

  <!-- SEPs -->
  <rect x="52" y="298" width="196" height="62" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="150" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">KUBE-SEP-1</text>
  <text x="150" y="337" text-anchor="middle" font-size="10.5" fill="#27ae60">DNAT</text>
  <text x="150" y="353" text-anchor="middle" font-size="10.5" fill="#0f172a" font-family="monospace">10.42.0.11:8080</text>

  <rect x="312" y="298" width="196" height="62" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="410" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">KUBE-SEP-2</text>
  <text x="410" y="337" text-anchor="middle" font-size="10.5" fill="#27ae60">DNAT</text>
  <text x="410" y="353" text-anchor="middle" font-size="10.5" fill="#0f172a" font-family="monospace">10.42.1.7:8080</text>

  <rect x="572" y="298" width="196" height="62" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="670" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">KUBE-SEP-3</text>
  <text x="670" y="337" text-anchor="middle" font-size="10.5" fill="#27ae60">DNAT</text>
  <text x="670" y="353" text-anchor="middle" font-size="10.5" fill="#0f172a" font-family="monospace">10.42.2.4:8080</text>
</svg>
