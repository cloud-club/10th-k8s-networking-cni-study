<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/></marker>
  </defs>
  <rect width="820" height="480" fill="#f8fafc" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Calico — 브릿지 없이 L3 라우터가 되고, 경로는 BGP로 주고받는다</text>

  <!-- Datastore -->
  <rect x="215" y="56" width="390" height="50" rx="8" fill="#f3ecf8" stroke="#8e44ad" stroke-width="2" filter="url(#s)"/>
  <text x="410" y="77" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">데이터스토어 — Kubernetes API (CRD) 또는 etcd</text>
  <text x="410" y="95" text-anchor="middle" font-size="9.5" fill="#64748b" font-family="monospace">IPPool · IPAMBlock · BGPPeer · NetworkPolicy · WorkloadEndpoint</text>
  <!-- kube-controllers -->
  <rect x="627" y="56" width="165" height="50" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#s)"/>
  <text x="709" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">calico-kube-controllers</text>
  <text x="709" y="95" text-anchor="middle" font-size="9.5" fill="#64748b">노드 삭제 시 IPAM 블록 회수(GC)</text>
  <line x1="627" y1="81" x2="607" y2="81" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ap)"/>
  <!-- Typha -->
  <rect x="28" y="56" width="165" height="50" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#s)"/>
  <text x="110" y="77" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Typha (선택)</text>
  <text x="110" y="95" text-anchor="middle" font-size="9.5" fill="#64748b">대규모에서 watch 부하 분산</text>
  <line x1="193" y1="81" x2="213" y2="81" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ap)"/>

  <!-- Node -->
  <rect x="28" y="130" width="764" height="330" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#s)"/>
  <text x="44" y="152" font-size="12" font-weight="700" fill="#64748b">Node</text>

  <!-- calico-node -->
  <rect x="48" y="168" width="340" height="130" rx="8" fill="#fdf3e3" stroke="#f39c12" stroke-width="2"/>
  <text x="218" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">calico-node (DaemonSet) — 프로세스 셋</text>
  <rect x="60" y="200" width="100" height="84" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.2"/>
  <text x="110" y="218" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Felix</text>
  <text x="110" y="234" text-anchor="middle" font-size="9.5" fill="#64748b">로컬 라우트</text>
  <text x="110" y="248" text-anchor="middle" font-size="9.5" fill="#64748b">iptables cali-*</text>
  <text x="110" y="262" text-anchor="middle" font-size="9.5" fill="#64748b">NetworkPolicy</text>
  <text x="110" y="276" text-anchor="middle" font-size="9.5" fill="#64748b">(또는 eBPF)</text>
  <rect x="168" y="200" width="100" height="84" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.2"/>
  <text x="218" y="218" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">BIRD</text>
  <text x="218" y="234" text-anchor="middle" font-size="9.5" fill="#64748b">BGP 데몬</text>
  <text x="218" y="248" text-anchor="middle" font-size="9.5" fill="#64748b">내 블록 광고</text>
  <text x="218" y="262" text-anchor="middle" font-size="9.5" fill="#64748b">남의 블록 수신</text>
  <text x="218" y="276" text-anchor="middle" font-size="9.5" fill="#64748b">→ 커널 라우트</text>
  <rect x="276" y="200" width="100" height="84" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.2"/>
  <text x="326" y="218" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">confd</text>
  <text x="326" y="234" text-anchor="middle" font-size="9.5" fill="#64748b">데이터스토어 →</text>
  <text x="326" y="248" text-anchor="middle" font-size="9.5" fill="#64748b">bird.cfg 렌더링</text>
  <text x="326" y="262" text-anchor="middle" font-size="9.5" fill="#64748b">피어 목록 갱신</text>
  <line x1="218" y1="168" x2="330" y2="108" stroke="#8e44ad" stroke-width="2" marker-end="url(#ap)"/>
  <text x="250" y="132" font-size="10" font-weight="700" fill="#8e44ad">watch</text>

  <!-- CNI binary -->
  <rect x="440" y="168" width="330" height="130" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="2"/>
  <text x="605" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">calico + calico-ipam 실행 파일</text>
  <text x="454" y="210" font-size="10.5" fill="#0f172a">데몬을 거치지 않고 <tspan font-weight="700">직접 데이터스토어와 대화</tspan></text>
  <text x="454" y="228" font-size="10.5" fill="#0f172a">① calico-ipam: 이 노드 블록(/26)에서 IP 하나 확보</text>
  <text x="454" y="246" font-size="10.5" fill="#0f172a">② veth 생성 — 호스트 쪽 이름 <tspan font-family="monospace">cali&lt;hash&gt;</tspan></text>
  <text x="454" y="264" font-size="10.5" fill="#0f172a">③ 호스트에 /32 라우트, Pod에 169.254.1.1 게이트웨이</text>
  <text x="454" y="282" font-size="10.5" fill="#0f172a">④ WorkloadEndpoint 기록 → Felix가 정책 적용</text>
  <line x1="605" y1="168" x2="470" y2="108" stroke="#8e44ad" stroke-width="2" marker-end="url(#ap)"/>
  <text x="555" y="132" font-size="10" font-weight="700" fill="#8e44ad">read / write</text>

  <!-- Kernel -->
  <rect x="48" y="316" width="722" height="130" rx="8" fill="#e8f4f8" stroke="#2980b9" stroke-width="2"/>
  <text x="62" y="337" font-size="12" font-weight="700" fill="#0f172a">커널에 남는 것 — 브릿지가 없다</text>
  <rect x="62" y="352" width="76" height="30" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="100" y="371" text-anchor="middle" font-size="10" fill="#0f172a">Pod 10.42.0.11</text>
  <rect x="62" y="392" width="76" height="30" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="100" y="411" text-anchor="middle" font-size="10" fill="#0f172a">Pod 10.42.0.12</text>
  <rect x="176" y="352" width="90" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1.2"/>
  <text x="221" y="371" text-anchor="middle" font-size="10" fill="#0f172a" font-family="monospace">cali1a2b3c</text>
  <rect x="176" y="392" width="90" height="30" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1.2"/>
  <text x="221" y="411" text-anchor="middle" font-size="10" fill="#0f172a" font-family="monospace">cali4d5e6f</text>
  <line x1="138" y1="367" x2="176" y2="367" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="138" y1="407" x2="176" y2="407" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="304" y="366" width="110" height="44" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="359" y="384" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">호스트 라우팅 테이블</text>
  <text x="359" y="400" text-anchor="middle" font-size="9.5" fill="#64748b">= 소프트웨어 라우터</text>
  <line x1="266" y1="367" x2="304" y2="380" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="266" y1="407" x2="304" y2="396" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="452" y="366" width="86" height="44" rx="5" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="495" y="384" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">eth0</text>
  <text x="495" y="400" text-anchor="middle" font-size="9" fill="#64748b">or tunl0 / vxlan</text>
  <line x1="414" y1="388" x2="452" y2="388" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="552" y="356" font-size="9.5" fill="#27ae60" font-weight="700">실행 파일이 심은 줄</text>
  <text x="552" y="371" font-size="9" fill="#0f172a" font-family="monospace">10.42.0.11 dev cali1a2b3c scope link</text>
  <text x="552" y="391" font-size="9.5" fill="#f39c12" font-weight="700">BIRD가 배운 줄 (node-2 블록)</text>
  <text x="552" y="406" font-size="9" fill="#0f172a" font-family="monospace">10.42.1.0/26 via 192.168.1.12 proto bird</text>
  <text x="552" y="426" font-size="9.5" fill="#64748b">무캡슐 · IPIP · VXLAN · CrossSubnet 중 선택</text>
</svg>
