<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/></marker>
    <marker id="aps" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#8e44ad"/></marker>
  </defs>
  <rect width="820" height="520" fill="#f8fafc" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Calico BGP — 세션이 한 줄을 만들고, 패킷은 감싸지 않고 달린다</text>

  <!-- node-1 -->
  <rect x="28" y="52" width="364" height="420" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#s)"/>
  <text x="44" y="74" font-size="12" font-weight="700" fill="#64748b">node-1 <tspan font-family="monospace" font-weight="400">192.168.1.11</tspan> — 송신</text>

  <!-- BIRD node-1 -->
  <rect x="48" y="86" width="328" height="56" rx="6" fill="#f3ecf8" stroke="#8e44ad" stroke-width="2"/>
  <text x="212" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">BIRD (calico-node) — AS 64512, router-id .11</text>
  <text x="60" y="121" font-size="9.5" fill="#0f172a">confd가 내 블록 10.42.0.0/26을 static으로 써넣음 → 광고</text>
  <text x="60" y="135" font-size="9.5" fill="#64748b">받은 UPDATE는 커널 라우팅 테이블에 proto bird로 기록</text>


  <line x1="212" y1="142" x2="212" y2="158" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="222" y="154" font-size="9" fill="#8e44ad">② 커널에 기록</text>

  <!-- routing table node-1 -->
  <rect x="48" y="158" width="328" height="82" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="212" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">라우팅 테이블</text>
  <text x="60" y="194" font-size="9.5" fill="#0f172a" font-family="monospace">10.42.0.5 dev cali1a2b3c4d scope link</text>
  <text x="60" y="208" font-size="9.5" fill="#64748b" font-family="monospace">blackhole 10.42.0.0/26 proto bird</text>
  <text x="60" y="222" font-size="9.5" font-weight="700" fill="#2980b9" font-family="monospace">10.42.1.0/26 via 192.168.1.12 dev eth0 proto bird</text>
  <text x="60" y="234" font-size="8.5" fill="#94a3b8">↑ node-2가 UPDATE로 보낸 NLRI + NEXT_HOP</text>

  <!-- Pod A -->
  <rect x="48" y="256" width="150" height="48" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="123" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Pod A 10.42.0.5</text>
  <text x="123" y="291" text-anchor="middle" font-size="9.5" fill="#64748b" font-family="monospace">default via 169.254.1.1</text>

  <line x1="123" y1="304" x2="123" y2="320" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- cali veth -->
  <rect x="48" y="320" width="150" height="52" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
  <text x="123" y="338" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">cali1a2b3c4d</text>
  <text x="123" y="352" text-anchor="middle" font-size="9.5" fill="#0f172a">① proxy_arp=1</text>
  <text x="123" y="365" text-anchor="middle" font-size="9.5" fill="#64748b">169.254.1.1 ARP에 내 MAC 답함</text>

  <line x1="198" y1="346" x2="212" y2="346" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="212" y1="346" x2="212" y2="240" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="218" y="300" font-size="9" fill="#2980b9">L3 조회</text>

  <!-- Felix -->
  <rect x="220" y="256" width="156" height="116" rx="6" fill="#fdf3e3" stroke="#f39c12" stroke-width="1.5"/>
  <text x="298" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Felix</text>
  <text x="232" y="292" font-size="9.5" fill="#0f172a">· Pod마다 /32 라우트</text>
  <text x="232" y="306" font-size="9.5" fill="#0f172a">· 내 블록 blackhole</text>
  <text x="232" y="320" font-size="9.5" fill="#0f172a">· cali-* iptables 체인 (정책)</text>
  <text x="232" y="334" font-size="9.5" fill="#0f172a">· MASQUERADE (natOutgoing)</text>
  <text x="232" y="352" font-size="9" fill="#64748b">라우트를 광고하는 건 BIRD,</text>
  <text x="232" y="365" font-size="9" fill="#64748b">Pod 앞을 지키는 건 Felix</text>

  <line x1="212" y1="372" x2="212" y2="388" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- eth0 node-1 -->
  <rect x="48" y="388" width="328" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="212" y="406" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">③ eth0 192.168.1.11</text>
  <text x="212" y="424" text-anchor="middle" font-size="9.5" fill="#64748b">ARP(192.168.1.12) → dst MAC = node-2 NIC. IP 헤더는 그대로</text>

  <text x="60" y="458" font-size="9.5" fill="#64748b">조회: 이웃(proxy ARP) ①, 라우트 ②, 이웃(eth0) ③. FDB도 캡슐화도 없다</text>


  <!-- node-2 -->
  <rect x="428" y="52" width="364" height="420" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#s)"/>
  <text x="444" y="74" font-size="12" font-weight="700" fill="#64748b">node-2 <tspan font-family="monospace" font-weight="400">192.168.1.12</tspan> — 수신</text>

  <rect x="448" y="86" width="328" height="56" rx="6" fill="#f3ecf8" stroke="#8e44ad" stroke-width="2"/>
  <text x="612" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">BIRD (calico-node) — AS 64512, router-id .12</text>
  <text x="460" y="121" font-size="9.5" font-weight="700" fill="#8e44ad" font-family="monospace">UPDATE: 10.42.1.0/26  NEXT_HOP 192.168.1.12</text>
  <text x="460" y="135" font-size="9.5" fill="#64748b">IPAM 블록 affinity를 받은 순간 광고가 시작된다</text>

  <line x1="612" y1="142" x2="612" y2="158" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#ap)"/>

  <rect x="448" y="158" width="328" height="82" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="612" y="176" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">라우팅 테이블</text>
  <text x="460" y="194" font-size="9.5" fill="#64748b" font-family="monospace">blackhole 10.42.1.0/26 proto bird</text>
  <text x="460" y="208" font-size="9.5" font-weight="700" fill="#2980b9" font-family="monospace">10.42.1.7 dev cali4d5e6f7g scope link</text>
  <text x="460" y="222" font-size="9.5" fill="#0f172a" font-family="monospace">10.42.0.0/26 via 192.168.1.11 dev eth0 proto bird</text>
  <text x="460" y="234" font-size="8.5" fill="#94a3b8">↑ /32가 blackhole /26보다 구체적이라 이긴다. 미할당 주소는 폐기</text>

  <rect x="448" y="256" width="150" height="48" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="523" y="274" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Pod B 10.42.1.7</text>
  <text x="523" y="291" text-anchor="middle" font-size="9.5" fill="#64748b">veth eth0로 수신</text>

  <line x1="523" y1="320" x2="523" y2="304" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="448" y="320" width="150" height="52" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
  <text x="523" y="338" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">cali4d5e6f7g</text>
  <text x="523" y="352" text-anchor="middle" font-size="9.5" fill="#0f172a">⑥ 10.42.1.7 MAC을 ARP</text>
  <text x="523" y="365" text-anchor="middle" font-size="9.5" fill="#64748b">Pod이 답함 → veth로 전달</text>

  <line x1="612" y1="240" x2="612" y2="256" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="612" y1="256" x2="612" y2="346" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="612" y1="346" x2="598" y2="346" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="618" y="300" font-size="9" fill="#2980b9">⑤ /32</text>

  <rect x="630" y="256" width="146" height="116" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="703" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">④ 포워딩</text>
  <text x="640" y="292" font-size="9.5" fill="#0f172a">dst 10.42.1.7 ≠ 내 IP</text>
  <text x="640" y="306" font-size="9.5" fill="#0f172a">ip_forward=1 → 라우팅</text>
  <text x="640" y="326" font-size="9.5" fill="#64748b">감싼 게 없으니</text>
  <text x="640" y="340" font-size="9.5" fill="#64748b">벗길 것도 없다</text>
  <text x="640" y="360" font-size="9" fill="#94a3b8">IPIP면 여기 앞에 tunl0</text>

  <line x1="703" y1="388" x2="703" y2="372" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="703" y1="256" x2="703" y2="240" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="448" y="388" width="328" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="612" y="406" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">④ eth0 192.168.1.12</text>
  <text x="612" y="424" text-anchor="middle" font-size="9.5" fill="#64748b">tcpdump host 10.42.1.7 → 그대로 잡힌다. 어디서 떠도 Pod IP</text>

  <text x="460" y="458" font-size="9.5" fill="#64748b">조회: 라우트 ⑤, 이웃(cali) ⑥. 라우팅 테이블 두 번, 이웃 두 번으로 끝</text>

  <text x="410" y="500" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">IPIP / CrossSubnet이면 굵은 줄의 dev만 tunl0으로 바뀐다. 나머지는 전부 같다 — 갈림길은 여전히 한 줄이다</text>
  <!-- inter-node elements, drawn last -->
  <line x1="376" y1="106" x2="448" y2="106" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#ap)" marker-start="url(#aps)"/>
  <text x="412" y="96" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8e44ad">TCP 179</text>
  <text x="412" y="122" text-anchor="middle" font-size="8" fill="#94a3b8">iBGP · hold 240s</text>
  <text x="412" y="134" text-anchor="middle" font-size="8" fill="#94a3b8">KEEPALIVE 80s</text>
  <line x1="376" y1="412" x2="448" y2="412" stroke="#27ae60" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="412" y="400" text-anchor="middle" font-size="8.5" font-weight="700" fill="#27ae60">Pod IP 그대로</text>
  <text x="412" y="428" text-anchor="middle" font-size="8" fill="#94a3b8">.0.5 → .1.7</text>
</svg>
