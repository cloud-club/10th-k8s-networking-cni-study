<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/></marker>
  </defs>
  <rect width="820" height="460" fill="#f8fafc" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Calico 정책이 걸리는 자리 — Pod 바로 앞 veth, 양쪽 끝에서 두 번</text>
  <text x="410" y="54" text-anchor="middle" font-size="10.5" fill="#64748b">node-2에 도착한 패킷이 Pod B(10.42.1.7)에 들어가기까지. 정책은 노드 사이 어딘가가 아니라 veth의 FORWARD 훅에 있다</text>

  <!-- node frame -->
  <rect x="28" y="70" width="764" height="252" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#s)"/>
  <text x="44" y="90" font-size="12" font-weight="700" fill="#64748b">node-2</text>

  <!-- ingress device -->
  <rect x="44" y="104" width="128" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="108" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">① 도착</text>
  <text x="108" y="138" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="monospace">eth0 / tunl0 /</text>
  <text x="108" y="150" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="monospace">vxlan.calico</text>
  <text x="108" y="168" text-anchor="middle" font-size="9" fill="#64748b">캡슐이면 여기서 벗김</text>

  <line x1="172" y1="140" x2="188" y2="140" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- routing -->
  <rect x="188" y="104" width="128" height="72" rx="6" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5"/>
  <text x="252" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">② 라우팅</text>
  <text x="252" y="140" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="monospace">10.42.1.7</text>
  <text x="252" y="152" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="monospace">dev cali4d5e6f7g</text>
  <text x="252" y="168" text-anchor="middle" font-size="9" fill="#64748b">출력 장치가 cali+로 정해짐</text>

  <line x1="316" y1="140" x2="332" y2="140" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#ap)"/>

  <!-- FORWARD hook / chains -->
  <rect x="332" y="98" width="300" height="214" rx="8" fill="#f3ecf8" stroke="#8e44ad" stroke-width="2"/>
  <text x="482" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">filter FORWARD → cali-FORWARD</text>
  <text x="344" y="136" font-size="9.5" fill="#0f172a" font-family="monospace">-o cali+ → cali-to-wl-dispatch</text>
  <text x="344" y="150" font-size="9.5" font-weight="700" fill="#8e44ad" font-family="monospace">  → cali-tw-cali4d5e6f7g   (ingress 정책)</text>
  <text x="356" y="168" font-size="9.5" fill="#0f172a">③ <tspan font-family="monospace">ctstate RELATED,ESTABLISHED → ACCEPT</tspan></text>
  <text x="368" y="180" font-size="8.5" fill="#64748b">흐름의 두 번째 패킷부터는 여기서 끝. 응답도 여기</text>
  <text x="356" y="196" font-size="9.5" fill="#0f172a">④ <tspan font-family="monospace">cali-pi-&lt;policy&gt;</tspan> — 정책마다 체인 하나</text>
  <text x="368" y="208" font-size="8.5" fill="#64748b" font-family="monospace">-m set --match-set cali40s:… src → ACCEPT</text>
  <text x="356" y="224" font-size="9.5" fill="#0f172a">⑤ <tspan font-family="monospace">cali-pri-kns.&lt;ns&gt;</tspan> — 정책이 없을 때의 프로파일</text>
  <text x="356" y="240" font-size="9.5" fill="#e74c3c">⑥ 어느 것에도 안 걸리면 DROP</text>
  <line x1="344" y1="252" x2="620" y2="252" stroke="#8e44ad" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="344" y="270" font-size="9.5" fill="#0f172a" font-family="monospace">-i cali+ → cali-from-wl-dispatch</text>
  <text x="344" y="284" font-size="9.5" fill="#64748b" font-family="monospace">  → cali-fw-&lt;veth&gt;   (egress 정책)</text>
  <text x="344" y="300" font-size="9" fill="#64748b">Pod에서 나갈 때는 출발 노드에서 이 쪽을 탄다 — 같은 구조</text>

  <line x1="632" y1="140" x2="648" y2="140" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- veth + pod -->
  <rect x="648" y="104" width="128" height="72" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⑦ cali4d5e6f7g</text>
  <text x="712" y="140" text-anchor="middle" font-size="9.5" fill="#0f172a">→ veth → Pod B</text>
  <text x="712" y="154" text-anchor="middle" font-size="9.5" fill="#0f172a" font-family="monospace">10.42.1.7</text>
  <text x="712" y="168" text-anchor="middle" font-size="9" fill="#64748b">Pod 안에서는 정책이 안 보인다</text>

  <!-- side notes inside node -->
  <rect x="44" y="192" width="272" height="116" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="210" font-size="10.5" font-weight="700" fill="#0f172a">정책이 보는 패킷</text>
  <text x="56" y="228" font-size="9.5" fill="#0f172a">①에서 벗긴 뒤의 <tspan font-weight="700">안쪽 패킷</tspan>. src 10.42.0.5, dst 10.42.1.7</text>
  <text x="56" y="242" font-size="9.5" fill="#0f172a">BGP로 왔는지 IPIP로 왔는지 VXLAN으로 왔는지는</text>
  <text x="56" y="256" font-size="9.5" fill="#0f172a">이 자리에서 보이지 않는다</text>
  <text x="56" y="276" font-size="9.5" fill="#64748b">→ 노드 사이를 건너는 방식(가로축)과</text>
  <text x="56" y="290" font-size="9.5" fill="#64748b">   판단하는 자리(세로축)가 독립인 이유</text>

  <!-- bottom notes -->
  <rect x="28" y="338" width="246" height="104" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="44" y="358" font-size="11" font-weight="700" fill="#0f172a">셀렉터 = ipset</text>
  <text x="44" y="376" font-size="9.5" fill="#0f172a">podSelector: app=frontend</text>
  <text x="44" y="390" font-size="9.5" fill="#0f172a">→ cali40s:… 집합 하나</text>
  <text x="44" y="408" font-size="9.5" fill="#64748b">Pod이 뜨고 죽으면 멤버만 바뀐다.</text>
  <text x="44" y="422" font-size="9.5" fill="#64748b">규칙은 그대로. 근거는 여전히 IP</text>

  <rect x="287" y="338" width="246" height="104" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="303" y="358" font-size="11" font-weight="700" fill="#0f172a">분산 방화벽</text>
  <text x="303" y="376" font-size="9.5" fill="#0f172a">A → B 한 흐름에 정책은 두 번 평가된다</text>
  <text x="303" y="390" font-size="9.5" fill="#0f172a">node-1: A의 cali-fw (egress)</text>
  <text x="303" y="404" font-size="9.5" fill="#0f172a">node-2: B의 cali-tw (ingress)</text>
  <text x="303" y="422" font-size="9.5" fill="#64748b">중앙 장비가 없다. Pod마다 자기 몫</text>

  <rect x="546" y="338" width="246" height="104" rx="8" fill="#fff7f7" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#s)"/>
  <text x="562" y="358" font-size="11" font-weight="700" fill="#e74c3c">Flannel에는 이 자리가 비어 있다</text>
  <text x="562" y="376" font-size="9.5" fill="#0f172a">FORWARD에 FLANNEL-FWD ACCEPT만 있다</text>
  <text x="562" y="390" font-size="9.5" fill="#0f172a">NetworkPolicy를 apply해도 읽는 데몬이 없다</text>
  <text x="562" y="408" font-size="9.5" fill="#64748b">모든 Pod ↔ 모든 Pod. 정책이 필요하면</text>
  <text x="562" y="422" font-size="9.5" fill="#64748b">Flannel 경로 + Felix 정책 = Canal</text>
</svg>
