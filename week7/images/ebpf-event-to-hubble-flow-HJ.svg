<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/></marker>
  </defs>
  <rect width="820" height="560" fill="#f8fafc" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">패킷 판단 하나가 hubble observe 한 줄이 되기까지</text>

  <!-- kernel band -->
  <rect x="20" y="52" width="780" height="200" rx="10" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="72" font-size="12" font-weight="700" fill="#2980b9">KERNEL</text>

  <rect x="40" y="88" width="210" height="64" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2" filter="url(#s)"/>
  <text x="145" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">bpf_lxc (tc @ lxc)</text>
  <text x="145" y="130" text-anchor="middle" font-size="10" fill="#475569" font-family="monospace">cil_from_container</text>
  <text x="145" y="144" text-anchor="middle" font-size="9.5" fill="#64748b">패킷 도착 → 판단</text>

  <rect x="300" y="80" width="230" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#s)"/>
  <text x="415" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">BPF Maps (/sys/fs/bpf/tc/globals)</text>
  <text x="316" y="124" font-size="10.5" fill="#0f172a" font-family="monospace">① cilium_ct4_global</text>
  <text x="316" y="142" font-size="10.5" fill="#0f172a" font-family="monospace">② cilium_ipcache</text>
  <text x="316" y="160" font-size="10.5" fill="#0f172a" font-family="monospace">③ cilium_policy_&lt;ep&gt;</text>
  <text x="316" y="178" font-size="10.5" fill="#0f172a" font-family="monospace">④ cilium_lb4_*  / cilium_lxc</text>
  <text x="316" y="204" font-size="9.5" fill="#64748b">조회 결과 = verdict</text>
  <text x="316" y="220" font-size="9.5" fill="#64748b">(FORWARDED / DROPPED + 이유)</text>

  <line x1="250" y1="112" x2="296" y2="112" stroke="#2980b9" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="298" y1="132" x2="252" y2="132" stroke="#2980b9" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="580" y="88" width="200" height="64" rx="8" fill="#f5eefa" stroke="#8e44ad" stroke-width="2" filter="url(#s)"/>
  <text x="680" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8e44ad">cilium_events</text>
  <text x="680" y="130" text-anchor="middle" font-size="10" fill="#475569">perf event array (CPU마다)</text>
  <text x="680" y="144" text-anchor="middle" font-size="9.5" fill="#64748b">trace / drop / policy-verdict</text>

  <path d="M145 152 L145 200 Q145 212 160 212 L660 212 Q680 212 680 196 L680 156" fill="none" stroke="#8e44ad" stroke-width="2" marker-end="url(#ap)"/>
  <text x="300" y="232" font-size="10" fill="#8e44ad" font-weight="700">send_trace_notify() / send_drop_notify()  — monitor aggregation이 여기서 거른다</text>

  <!-- user band -->
  <rect x="20" y="268" width="780" height="180" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="288" font-size="12" font-weight="700" fill="#475569">USERSPACE — cilium-agent Pod (노드마다)</text>

  <rect x="580" y="304" width="200" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#s)"/>
  <text x="680" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Monitor Agent</text>
  <text x="680" y="344" text-anchor="middle" font-size="9.5" fill="#64748b">perf 버퍼 읽기 (cilium-dbg monitor)</text>

  <rect x="310" y="304" width="220" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#s)"/>
  <text x="420" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Hubble Observer + Parser</text>
  <text x="420" y="344" text-anchor="middle" font-size="9.5" fill="#64748b">IP → Pod 이름·라벨·Identity로 decorate</text>

  <rect x="40" y="304" width="220" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#s)"/>
  <text x="150" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Ring Buffer</text>
  <text x="150" y="344" text-anchor="middle" font-size="9.5" fill="#64748b">기본 4095개. 넘치면 오래된 것부터 사라짐</text>

  <line x1="680" y1="252" x2="680" y2="300" stroke="#8e44ad" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="580" y1="332" x2="534" y2="332" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="310" y1="332" x2="264" y2="332" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="380" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#s)"/>
  <text x="150" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Hubble gRPC (:4244)</text>
  <text x="150" y="419" text-anchor="middle" font-size="9.5" fill="#64748b">GetFlows</text>
  <line x1="150" y1="360" x2="150" y2="376" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="310" y="380" width="220" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#s)"/>
  <text x="420" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Hubble Metrics</text>
  <text x="420" y="419" text-anchor="middle" font-size="9.5" fill="#64748b">drop / flow / dns / policy → Prometheus</text>
  <line x1="420" y1="360" x2="420" y2="376" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- cluster band -->
  <rect x="40" y="470" width="300" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#s)"/>
  <text x="190" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">hubble-relay (Deployment)</text>
  <text x="190" y="512" text-anchor="middle" font-size="9.5" fill="#64748b">모든 노드의 :4244에 붙어 클러스터 뷰로 합침</text>
  <line x1="150" y1="430" x2="150" y2="466" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="400" y="470" width="380" height="60" rx="8" fill="#eaf2fb" stroke="#2980b9" stroke-width="2" filter="url(#s)"/>
  <text x="590" y="494" text-anchor="middle" font-size="11" fill="#0f172a" font-family="monospace">hubble observe --verdict DROPPED</text>
  <text x="590" y="512" text-anchor="middle" font-size="9.5" fill="#2980b9" font-weight="700">frontend (ID:1234) -&gt; backend:9090 policy-verdict:none DENIED / Policy denied DROPPED</text>
  <line x1="340" y1="500" x2="396" y2="500" stroke="#2980b9" stroke-width="2" marker-end="url(#ab)"/>
</svg>
